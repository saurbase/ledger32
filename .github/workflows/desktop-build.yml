name: Desktop installers

# Builds the Ledger desktop app (Windows .exe installer + Linux .deb) on every
# push to main, and publishes them as a GitHub Release.
#   - push to main      -> pre-release tagged v<version>-build.<run_number>
#   - push of a v* tag  -> full release using that tag
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-exe
            os: windows-latest
            target: --win nsis
            files: dist-electron/*.exe
          - name: linux-deb
            os: ubuntu-latest
            target: --linux deb
            files: dist-electron/*.deb
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No code-signing certificate configured: build unsigned installers.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js standalone server
        run: |
          bunx next build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

      - name: Package installer
        run: bunx electron-builder ${{ matrix.target }} --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            EXTRA=""
          else
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            EXTRA="--prerelease"
          fi
          ls -la dist
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Ledger $TAG" \
            --generate-notes \
            $EXTRA
